sensor:
  - id: !extend panaproxy_${ name | lower }_power_production
    on_value:
      then:
        - component.update: panaproxy_cop_${ name | lower }
  - id: !extend panaproxy_${ name | lower }_power_consumption
    on_value:
      then:
        - component.update: panaproxy_cop_${ name | lower }
  - id: !extend panaproxy_${ name | lower }_power_production_extra
    on_value:
      then:
        - component.update: panaproxy_cop_${ name | lower }
  - id: !extend panaproxy_${ name | lower }_power_consumption_extra
    on_value:
      then:
        - component.update: panaproxy_cop_${ name | lower }

  - platform: template
    id: panaproxy_cop_${ name | lower }
    name: COP ${ name }
    unit_of_measurement: ""
    accuracy_decimals: 2
    update_interval: never
    state_class: measurement
    device_id: heatpump_device
    lambda: |-
      auto extra = id(panaproxy_${ name | lower }_power_consumption_extra).has_state();
      auto production_entity = extra ? id(panaproxy_${ name | lower }_power_production_extra) : id(panaproxy_${ name | lower }_power_production);
      auto consumption_entity = extra ? id(panaproxy_${ name | lower }_power_consumption_extra) : id(panaproxy_${ name | lower }_power_consumption);
      if (consumption_entity->state <= 5) {
        return 0.0f;
      }
      return production_entity->state / consumption_entity->state;
