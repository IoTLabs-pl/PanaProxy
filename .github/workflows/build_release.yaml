name: Build release firmware
on:
  release:
    types:
      - published
jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        config:
          - factory.yaml
          - factory_eth.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build firmware
        id: build_firmware
        uses: esphome/build-action@v7.4.0
        with:
          yaml-file: ${{ matrix.config }}
          release-summary: ${{ github.event.release.body }}
          release-url: ${{ github.event.release.html_url }}
          complete-manifest: true
      - name: Rename manifest file
        working-directory: ${{ steps.build_firmware.outputs.name }}
        run: |
          mv manifest.json ${{ steps.build_firmware.outputs.original-name }}.manifest.json
      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            ${{ steps.build_firmware.outputs.name }}/*.json
            ${{ steps.build_firmware.outputs.name }}/*.bin